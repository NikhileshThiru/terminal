# Same compose file runs on: dev Mac (now), spare laptop (24/7 target), or VPS (fallback).
# See docs/runbook.md for day-to-day commands.

# Three logical processes that meet only at Postgres + Redis (CLAUDE.md §4):
#   ingestion  -> publishes DiscoveryEvents to the Redis Streams bus
#   backend    -> FastAPI + the agent worker (consumes the bus, writes theses)
#   frontend   -> the React terminal
services:
  backend:
    build: ./backend
    container_name: terminal-backend
    # Migrations run on every start (idempotent), so a fresh volume works
    # with a plain `docker compose up`.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://terminal:terminal@postgres:5432/terminal
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS: redis
      INGESTION_MODE: external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    # Same image, different entrypoint: the always-on producer. Holds the
    # Alpaca news websocket + EDGAR poller and publishes to Redis Streams.
    build: ./backend
    container_name: terminal-ingestion
    command: python -m app.discovery.ingest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://terminal:terminal@postgres:5432/terminal
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS: redis
    depends_on:
      backend:
        condition: service_healthy  # backend has applied migrations
      redis:
        condition: service_healthy
    healthcheck:
      # No HTTP server here: healthy == its heartbeat key is fresh in Redis.
      test:
        - CMD
        - python
        - -c
        - "import os,sys,redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL']).exists('terminal:ingest:status') else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle; it's the API address as the *browser*
        # sees it (published port on the host), not the compose-internal name.
        VITE_API_URL: http://localhost:8000
    container_name: terminal-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: terminal-postgres
    environment:
      POSTGRES_USER: terminal
      POSTGRES_PASSWORD: terminal
      POSTGRES_DB: terminal
    # Loopback only: default credentials must never face the LAN. Containers
    # reach it as postgres:5432 on the compose network regardless.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal -d terminal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: terminal-redis
    ports:
      - "127.0.0.1:6379:6379"  # loopback only (no Redis auth)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
